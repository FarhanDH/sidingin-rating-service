# fly.toml app configuration file generated for sidingin-rating-service on 2026-10-30T23:14:34+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sidingin-rating-service'
primary_region = 'sin'

[build]
    dockerfile = "Dockerfile"


[env]
    SERVER_PORT = "8080"
    GRPC_PORT = "50051"

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = "tcp"
  internal_port = 50051
  auto_stop_machines = 'stop'
  min_machines_running = 1
